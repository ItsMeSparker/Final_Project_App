

services:
  app:
    container_name: final_project_frontend
    build: .
    ports:
      - "8082:8081"
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
    stdin_open: true
    tty: true
    # This is the magic snippet that replaces standard volumes:
    develop:
      watch:
        - action: sync
          path: .
          target: /usr/src/app
          ignore:
            - node_modules/